<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M/s XYZ & Co. | Chartered Accountants</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f8f8f8;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #002244;
      color: white;
      padding: 20px;
      text-align: center;
      position: relative;
    }

    header img {
      position: absolute;
      top: 15px;
      left: 20px;
      height: 60px;
    }

    header h1 {
      margin: 0;
      font-size: 2em;
    }

    header p {
      margin-top: 5px;
      font-size: 1rem;
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      min-height: 70vh;
      text-align: center;
      padding: 20px;
    }

    input, textarea, button {
      display: block;
      width: 90%;
      max-width: 400px;
      margin: 15px auto;
      padding: 12px;
      font-size: 16px;
      border-radius: 5px;
    }

    button {
      background-color: #0066cc;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #004c99;
    }

    .status-message {
      font-weight: bold;
      color: #0077cc;
      font-size: 18px;
      margin-top: 20px;
    }

    footer {
      background-color: #002244;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 0.95em;
    }
  </style>
</head>
<body>

<header>
  <img src="your-logo-url.png" alt="Firm Logo" />
  <h1>M/s XYZ & Co.</h1>
  <p>Chartered Accountants</p>
</header>

<main>
  <p style="font-size: 20px; color: #333; font-weight: bold;">
    Mark your attendance below.<br>
    Ensure your GPS is enabled.
  </p>

  <input type="text" id="name" placeholder="Enter your name" required />
  <textarea id="remarks" placeholder="In/Out?"></textarea>
  <button onclick="submitForm()">Submit Attendance</button>

  <p id="status" class="status-message"></p>
</main>

<footer>
  &copy; 2025<br>
  M/s XYZ & Co., Chartered Accountants<br>
  All rights reserved.
</footer>

<script>
  function submitForm() {
    const name = document.getElementById('name').value.trim();
    const remarks = document.getElementById('remarks').value.trim();
    const userAgent = navigator.userAgent;

    if (!name) {
      document.getElementById('status').innerText = ⚠️ Please enter your name.';
      return;
    }

    document.getElementById('status').innerText = '📡 Getting location...';

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        const data = new URLSearchParams();
        data.append('name', name);
        data.append('latitude', lat);
        data.append('longitude', lon);
        data.append('remarks', remarks);
        data.append('userAgent', userAgent);

        console.log('Submitting attendance for:', name, lat, lon, remarks);

        fetch('https://script.google.com/macros/s/AKfycbw5xM9a5qRX3VfWPgvWEcM20OH1UJPpUar9-eW6Cw2KDswif0yDC8X8iMYAOCT5Rt8ctw/exec', {
          method: 'POST',
          body: data
        })
        .then(response => response.text())
        .then(responseText => {
          document.getElementById('status').innerText = responseText;
          document.getElementById('name').value = '';
          document.getElementById('remarks').value = '';
        })
        .catch(() => {
          document.getElementById('status').innerText = '❌ Error submitting attendance.';
        });

      }, () => {
        document.getElementById('status').innerText = '❌ Could not get location.';
      });
    } else {
      document.getElementById('status').innerText = '❌ Geolocation not supported.';
    }
  }
</script>

</body>
</html>
